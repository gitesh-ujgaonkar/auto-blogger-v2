services:
  - type: cron
    name: neuroscribe-blog-generator
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python ai_news_blogger_enhanced.py
    schedule: "0 */2 * * *"  # Run every 2 hours
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false 